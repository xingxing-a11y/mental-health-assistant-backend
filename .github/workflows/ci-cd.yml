name: CI/CD · backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的推送串行执行，避免两次部署打架
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 编译 + 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: mvn verify（全量单测，不依赖外部服务）
        run: mvn -B -ntp verify

      - name: 收集部署产物
        run: |
          mkdir -p deploy
          cp target/assistant-backend-0.0.1-SNAPSHOT.jar deploy/app.jar
          cp docker-compose.yml deploy/docker-compose.yml

      - name: 上传产物（后续 job 下载，也可人工下载）
        uses: actions/upload-artifact@v4
        with:
          name: backend-deploy
          path: deploy/
          retention-days: 7

  deploy:
    name: 部署到阿里云
    needs: build
    # 只在 main 推送时部署；PR 只跑 CI
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-deploy
          path: deploy

      - name: 准备 SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          test -s ~/.ssh/deploy_key || { echo "::error::SSH_PRIVATE_KEY 为空，请检查仓库 Secret"; exit 1; }
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: rsync 产物到服务器
        run: |
          SSHV="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          rsync -avz --chmod=D755,F644 -e "$SSHV" \
            deploy/app.jar \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/mindharbor/backend/app.jar"
          rsync -avz --chmod=D755,F644 -e "$SSHV" \
            deploy/docker-compose.yml \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/mindharbor/docker-compose.yml"

      - name: 校验服务器 .env 含 RabbitMQ 配置
        # compose 里 RABBITMQ_USERNAME / RABBITMQ_PASSWORD 用了 ${VAR:?} 必填校验：
        # 缺任何一个 docker compose up -d 都会整体失败，且报错埋在 compose 输出里不好定位。
        # VIRTUAL_HOST 有默认值 mh，不强制要求，但缺失时提示一下实际用的是什么。
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            'set -e; cd /opt/mindharbor
             missing=""
             for k in RABBITMQ_USERNAME RABBITMQ_PASSWORD; do
               grep -qE "^${k}=.+" .env || missing="$missing $k"
             done
             if [ -n "$missing" ]; then
               echo "ERROR: 服务器 .env 缺少:$missing"
               echo "compose 对这两个变量做了必填校验，缺失会让 docker compose up -d 直接失败。"
               echo "请参考 .env.example 的 RabbitMQ 段补齐后重试。"
               exit 1
             fi
             vhost=$(grep -E "^RABBITMQ_VIRTUAL_HOST=" .env | cut -d= -f2 || true)
             echo "RabbitMQ 环境变量齐全，vhost=${vhost:-mh（默认值）}"'

      - name: 重启后端容器
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            'set -e; cd /opt/mindharbor && docker compose up -d && docker compose restart backend && sleep 8 && docker compose ps'
