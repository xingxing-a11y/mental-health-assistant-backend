openapi: 3.0.3
info:
  title: MindHarbor 心理健康 AI 助手 API
  version: 1.0.0
  description: |
    一期 MVP 接口文档。
    AI 只提供心理陪伴和心理科普，不进行医学诊断。
    所有业务接口真实地址必须包含 /api/v1。
servers:
  - url: /api/v1
    description: API 统一前缀；导入 Apifox 时填写实际服务域名
security:
  - cookieAuth: []
tags:
  - name: Auth
    description: 注册、登录和退出登录
  - name: User
    description: 普通用户个人资料
  - name: Chat
    description: AI 会话和 SSE 对话
  - name: Assessment
    description: 心理测评
  - name: Article
    description: 心理科普文章
  - name: Admin User
    description: 管理员用户管理
  - name: Admin Knowledge
    description: 管理员知识库管理
  - name: Admin Assessment
    description: 管理员量表管理
  - name: Admin Article
    description: 管理员心理科普文章管理
  - name: Diary
    description: 二期情绪日记
  - name: Emotion
    description: 二期情绪趋势
  - name: Chat Extension
    description: 二期会话设置和消息收藏
  - name: Admin Audit
    description: 二期高危会话审计
  - name: Admin Statistics
    description: 二期数据统计
  - name: Announcement
    description: 用户侧公开系统公告
  - name: Admin Announcement
    description: 二期系统公告
  - name: Relax
    description: 三期放松小工具（呼吸练习、冥想引导、压力打卡与趋势）
  - name: Assessment Extension
    description: 三期量表收藏、结果对比与量表推荐
  - name: Chat Security
    description: 三期发送前敏感内容预校验（服务端主接口同样强制校验）
  - name: User Settings
    description: 三期个人设置与账号注销
  - name: System Policy
    description: 三期隐私协议、数据用途与心理援助热线
  - name: Feedback
    description: 三期用户意见反馈
  - name: Notification
    description: 三期系统通知
  - name: Admin Notification
    description: 三期管理员通知推送与撤回
  - name: Admin Sensitive Word
    description: 三期敏感词词库管理
  - name: Admin Feedback
    description: 三期反馈工单管理
  - name: Admin Operation Log
    description: 三期管理员操作审计
  - name: Admin System Setting
    description: 三期知识库分片参数全局配置
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: 用户注册
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 注册成功并自动登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/login:
    post:
      tags: [Auth]
      summary: 用户或管理员登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: 退出登录
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me:
    get:
      tags: [User]
      summary: 查询当前用户资料
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [User]
      summary: 修改当前用户资料
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/password:
    put:
      tags: [User]
      summary: 修改当前用户密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/avatar:
    post:
      tags: [User]
      summary: 上传当前用户头像
      description: |-
        使用 multipart/form-data 上传，字段名固定为 file，仅接受 image/jpeg、image/png、image/webp，单文件最大 2MB，超限返回 400。
        文件以随机 UUID 命名，按配置项 storage.type 落到两处存储之一：local 写本地磁盘（storage.local.directory，默认 ./uploads/avatars，可用环境变量 AVATAR_UPLOAD_DIR 覆盖），oss 写阿里云 OSS（storage.oss.*，bucket 保持私有）。
        数据库 users.avatar_url 只保存 /uploads/avatars/&lt;文件名&gt; 相对路径，
        读取统一由 GET /uploads/avatars/{filename} 承担，两种存储对外地址一致，同样需要登录，未登录返回 401。
        上传成功后 data 为当前用户对象（包含新的 avatarUrl），同时删除该用户上一张头像文件；旧头像清理失败不影响本次上传。
        文件名与实际字节数均由服务端实测，不信任请求声明的长度；超过 2MB 在读取阶段即中断并返回 400。
        写库采用条件更新（UPDATE ... WHERE id=? AND avatar_url &lt;=&gt; 原值）：
        若同一用户在本次请求期间已由另一请求改过头像，本次更新影响行数为 0，服务端先删除刚上传的新对象再返回 409，
        不会覆盖对方的结果，也不会留下无引用对象。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPG、PNG 或 WEBP 图片，最大 2MB
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /uploads/avatars/{filename}:
    get:
      tags: [User]
      summary: 读取头像文件
      description: |-
        返回头像图片的二进制内容，响应体不是 { code, message, data } 结构，因此不套 ApiResponse。
        该地址需要登录，未登录返回 401；文件名不符合上传接口生成的形态、或头像文件不存在，都返回 404。
        404 是空响应体，不带 ApiResponse JSON——本接口成功时返回二进制流，与全局异常处理器产出
        的 JSON 不同源，因此异常在本控制器内被收敛为无体 404，浏览器的 &lt;img&gt; 标签据此直接走 onerror。
        头像存本地磁盘时直接读文件，存阿里云 OSS 时由后端从私有 bucket 读取后转发，客户端不接触任何存储凭据，也无法绕过登录直接访问对象存储。
        响应带 Cache-Control: private, max-age=3600；文件名是随机 UUID、内容不会再变化，可以安全缓存。
        响应同时带 Content-Disposition: inline 与 X-Content-Type-Options: nosniff。
      parameters:
        - $ref: '#/components/parameters/AvatarFilename'
      responses:
        '200':
          description: 头像图片内容
          headers:
            Cache-Control:
              description: 固定为 private, max-age=3600
              schema: { type: string }
            Content-Disposition:
              description: 固定为 inline，避免浏览器弹下载框
              schema: { type: string }
            X-Content-Type-Options:
              description: 固定为 nosniff，禁止浏览器嗅探内容类型
              schema: { type: string }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |-
            头像不存在，或文件名不符合上传接口生成的形态，两者不区分，避免用错误码探测存储布局。
            响应体为空，不返回 ApiResponse JSON。
          headers:
            X-Content-Type-Options:
              description: 固定为 nosniff
              schema: { type: string }

  /chat/sessions:
    get:
      tags: [Chat]
      summary: 查询当前用户会话列表
      responses:
        '200':
          $ref: '#/components/responses/SessionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Chat]
      summary: 新建聊天会话
      description: name 可选；为空时由后端自动生成会话名称。
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /chat/sessions/archived:
    get:
      tags: [Chat]
      summary: 查询当前用户已归档会话
      responses:
        '200':
          $ref: '#/components/responses/SessionList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /chat/sessions/{sessionId}/messages:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Chat]
      summary: 查询会话历史消息
      responses:
        '200':
          $ref: '#/components/responses/MessageList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Chat]
      summary: SSE 流式发送 AI 消息
      description: |
        使用 POST + fetch + ReadableStream，不使用原生 EventSource。
        请求头必须包含 Accept: text/event-stream。
        后端必须返回 Content-Type: text/event-stream;charset=UTF-8。
        事件名称固定为 message、ping、risk、done、error。
        ping 是心跳，前端收到后丢弃；risk 用于独立展示危机提示；HIGH 风险时停止普通回复。
        服务端强制敏感词校验：本接口与 POST /chat/sensitive-check 复用同一套判定入口，命中 HIGH 级时不调用模型，
        直接通过 risk 事件返回 { level, message, hotline }；命中 CARE 级不阻断回复，只写一条不含原文的审计记录。
        绕过前端预校验直接调用本接口同样会被拦截。
        Swagger UI 不负责调试 SSE，请使用 Vue fetch + ReadableStream 或 Apifox 流式调试。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
      responses:
        '200':
          description: SSE 事件流
          content:
            text/event-stream:
              schema:
                type: string
                description: message、ping、risk、done、error 事件组成的文本流
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /chat/sessions/{sessionId}/context:
    delete:
      tags: [Chat]
      summary: 清空会话上下文
      description: 只清除后续请求传给大模型的记忆，数据库历史消息全部保留。
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /chat/sessions/{sessionId}:
    delete:
      tags: [Chat]
      summary: 永久删除已归档会话
      description: 物理删除会话及其全部消息，不可恢复。
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /chat/sessions/{sessionId}/archive:
    put:
      tags: [Chat]
      summary: 归档会话
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /chat/sessions/{sessionId}/unarchive:
    put:
      tags: [Chat]
      summary: 取消归档会话
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /chat/sessions/{sessionId}/pin:
    put:
      tags: [Chat]
      summary: 切换会话置顶状态
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /assessments/scales:
    get:
      tags: [Assessment]
      summary: 查询测评量表列表
      description: |
        data 为量表数组，元素包含 id、name、description、applicableScene、published 和 favorited。
        favorited 标记当前登录用户是否已收藏该量表；该接口无需登录，匿名访问时 favorited 恒为 false。
      security: []
      responses:
        '200':
          description: 查询成功，data 为量表数组
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AssessmentScale' }

  /assessments/scales/{scaleId}:
    get:
      tags: [Assessment]
      summary: 查询量表详情和题目
      description: |
        无需登录即可访问。返回量表的 id、name、description、applicableScene 和按顺序排列的 questions，
        每个题目包含 options 选项列表。
      security: []
      parameters:
        - $ref: '#/components/parameters/ScaleId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'

  /assessments:
    post:
      tags: [Assessment]
      summary: 提交测评并生成基础报告
      description: |
        分数由后端查询题目配置后计算，前端不得传入或覆盖分数，AI 解读需要用户另行请求。
        返回 resultId、totalScore、standardScore、rangeDescription 和 suggestions（字符串数组）；
        两条建议按行写入 assessment_results.suggestions，落库内容与响应保持一致。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentSubmitRequest'
      responses:
        '200':
          $ref: '#/components/responses/AssessmentReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Assessment]
      summary: 查询当前用户测评历史
      description: |
        按时间倒序返回当前用户自己的测评记录，字段为 id、scaleName、totalScore、standardScore、
        rangeDescription、suggestions（字符串数组，由落库文本按行还原）和 createdAt，
        不返回 userId、scaleId 等内部标识。
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /assessments/analysis:
    post:
      tags: [Assessment]
      summary: 用户主动请求测评结果 AI 分析
      description: 返回 analysis 字段，内容为 AI 生成的情绪倾向解读和安慰建议，仅本人可请求自己的测评结果；AI 解读按需生成，不写回 suggestions 字段。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resultId]
              properties:
                resultId: { type: integer, format: int64 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /articles:
    get:
      tags: [Article]
      summary: 查询心理科普文章
      security: []
      parameters:
        - in: query
          name: keyword
          schema:
            type: string
          description: 按标题模糊搜索
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /articles/{articleId}:
    get:
      tags: [Article]
      summary: 查询科普文章详情
      security: []
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users:
    get:
      tags: [Admin User]
      summary: 管理员查询用户列表
      description: 仅 ADMIN 角色可调用，不返回聊天明文内容。
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: nickname
          in: query
          required: false
          description: 按用户名（用户昵称）进行模糊搜索
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/{userId}/status:
    put:
      tags: [Admin User]
      summary: 管理员启用或禁用用户
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/knowledge-documents:
    get:
      tags: [Admin Knowledge]
      summary: 管理员查询知识库文档
      description: 仅 ADMIN 角色可调用。
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin Knowledge]
      summary: 新增知识库文档
      description: 保存文档后需要调用手动向量化接口。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeDocumentRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/knowledge-documents/{documentId}:
    put:
      tags: [Admin Knowledge]
      summary: 编辑知识库文档
      description: 编辑后旧向量失效，必须重新向量化。
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeDocumentRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin Knowledge]
      summary: 删除知识库文档
      description: 同步删除 MySQL 文档记录和向量片段。
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/knowledge-documents/{documentId}/vectorize:
    post:
      tags: [Admin Knowledge]
      summary: 手动向量化知识库文档
      description: 幂等接口：文档已处于「已向量化」状态时直接返回，不重复切片、不重复调用向量模型；需要强制重算请改用 re-vectorize。
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/knowledge-documents/{documentId}/re-vectorize:
    post:
      tags: [Admin Knowledge]
      summary: 重新向量化知识库文档
      description: 无条件重建：执行前删除旧向量，然后切片、Embedding 并写入新向量。
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
