      summary: 导出单次会话
      description: |
        导出当前用户自己的会话，返回文件流并带 Content-Disposition: attachment。
        format 支持 txt 与 pdf，缺省 txt，其它取值返回 400。
        TXT 使用 UTF-8 并带 BOM；PDF 使用 OpenPDF（LGPL/MPL），中文字体按外部路径、classpath、系统字体三级兜底，
        字体全部缺失时返回 400 与“未配置中文字体”。
        导出属于重资源操作，并发超限时返回 429 与“导出任务繁忙，请稍后重试”。
      parameters:
        - $ref: '#/components/parameters/ExportFormat'
      responses:
        '200':
          description: 导出成功，响应体为文件流
          headers:
            Content-Disposition:
              description: 形如 attachment; filename="会话名.txt"
              schema: { type: string }
          content:
            text/plain:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /users/me/settings:
    get:
      tags: [User Settings]
      summary: 查询个人设置
      description: 未初始化时返回默认值：温柔陪伴、常速输出、永久保存对话、数据授权关闭、浅色主题、中号字号、提示音开启、危机提示开启。
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [User Settings]
      summary: 更新个人设置
      description: 未提交的字段保持原值；未初始化的用户首次提交时自动创建记录。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserSettingsRequest' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/deactivate:
    post:
      tags: [User Settings]
      summary: 注销账号（匿名化保留）
      description: |
        注销采用匿名化保留，不物理删除会话、消息、日记、测评与收藏数据。
        服务端只改写 users 一行：status=CLOSED、写入 deactivated_at、username 改为 closed_{id}，
        并清空 nickname、avatar_url、gender、age，重置登录失败计数与锁定状态；随后删除头像文件（失败只记日志）。
        注销成功后清除登录 Cookie，旧 Cookie 在令牌过期前即失效。前端必须先二次确认。
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /system/policy:
    get:
      tags: [System Policy]
      summary: 查询隐私协议与心理援助热线
      description: 无需登录。data 包含 version、privacyPolicy、dataUsage、disclaimer 和 hotlines 数组。
      security: []
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SystemPolicy' }

  /feedbacks:
    post:
      tags: [Feedback]
      summary: 提交意见反馈
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeedbackRequest' }
      responses:
        '200':
          description: 提交成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Feedback' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications:
    get:
      tags: [Notification]
      summary: 分页查询本人可见通知
      description: |
        返回 scope=ALL 的全体通知，以及 scope=USER 且 target_user_id 为当前用户的通知；
        自动过滤已过期通知（expire_at 为空表示永不过期），每项包含 read 标记。单页上限 50。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 分页查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NotificationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/unread-count:
    get:
      tags: [Notification]
      summary: 查询未读通知数
      description: '轻量接口，供前端铃铛低频轮询；data 形如 { "count": 3 }。'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [count]
                        properties:
                          count: { type: integer, format: int64, example: 3 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/{id}/read:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    put:
      tags: [Notification]
      summary: 标记单条通知已读
      description: 幂等操作，重复标记不报错；通知不属于当前用户或已过期时返回 404。
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications/read-all:
    put:
      tags: [Notification]
      summary: 全部标记已读
      description: 一次性把当前用户可见且未过期的通知标记为已读，服务端用一条 INSERT ... SELECT 完成。
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/notifications:
    get:
      tags: [Admin Notification]
      summary: 分页查询推送记录
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 分页查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NotificationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin Notification]
      summary: 推送心理小贴士
      description: |
        scope 为 ALL 时 userId 忽略；为 USER 时 userId 必填，目标用户不存在返回 404。
        expireAt 可选，未提供时默认 30 天后过期；permanent=true 表示永不过期并忽略 expireAt；
        expireAt 早于当前时间返回 400。推送与撤回都会写入管理员操作日志。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPushRequest' }
      responses:
        '200':
          description: 推送成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Notification' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/notifications/{id}:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    delete:
      tags: [Admin Notification]
      summary: 撤回通知推送
      description: 删除通知主记录，已读记录随外键级联删除；撤回后用户列表与未读数同步还原。
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/sensitive-words:
    get:
      tags: [Admin Sensitive Word]
      summary: 查询敏感词词库
      description: 返回词条数组，按级别排序（HIGH 在前）；词库为空时对话校验回退内置词表。
      responses:
        '200':
          description: 查询成功，data 为词条数组
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SensitiveWord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin Sensitive Word]
      summary: 新增敏感词
      description: level 为 CARE 时命中只提示并写审计，为 HIGH 时命中会阻断回复；重复词条返回 400。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SensitiveWordRequest' }
      responses:
        '200':
          description: 新增成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SensitiveWord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/sensitive-words/{id}:
    parameters:
      - $ref: '#/components/parameters/SensitiveWordId'
    put:
      tags: [Admin Sensitive Word]
      summary: 修改敏感词
      description: enabled 不提交时保持原值；改成已存在的词条返回 400。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SensitiveWordRequest' }
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SensitiveWord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin Sensitive Word]
      summary: 删除敏感词
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/feedbacks:
    get:
      tags: [Admin Feedback]
      summary: 分页查询反馈工单
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/FeedbackStatus'
      responses:
        '200':
          description: 分页查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FeedbackPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/feedbacks/{id}:
    parameters:
      - $ref: '#/components/parameters/FeedbackId'
    put:
      tags: [Admin Feedback]
      summary: 处理反馈工单
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeedbackHandleRequest' }
      responses:
        '200':
          description: 处理成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Feedback' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/operation-logs:
    get:
      tags: [Admin Operation Log]
      summary: 分页查询管理员操作日志
      description: |
        记录新增/编辑/删除知识库文档、量表发布与删除、科普文章增删改、系统公告增删改、
        用户禁用与启用、通知推送与撤回；只记录操作者、类型、目标与摘要，不含业务正文。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/OperationType'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: 分页查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OperationLogPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/knowledge-settings:
    get:
      tags: [Admin System Setting]
      summary: 查询知识库分片参数
      description: 未配置时返回配置文件默认值（chunkSize 1000、chunkOverlap 100）。
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/KnowledgeSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Admin System Setting]
      summary: 更新知识库分片参数
      description: |
        chunkSize 取值 100-4000，chunkOverlap 取值 0-1000 且必须小于 chunkSize，否则返回 400。
        参数在向量化时读取，修改后需重新向量化已有文档才会生效。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeSettingsRequest' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/KnowledgeSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: mh_token
      description: 登录后由后端写入 HttpOnly + SameSite=Lax 的 Cookie；鉴权由 Spring Security 统一裁决，未登录返回 401，角色不足返回 403。
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ScaleId:
      name: scaleId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ArticleId:
      name: articleId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    DiaryId:
      name: diaryId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    NotificationId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    SensitiveWordId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    FeedbackId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    AvatarFilename:
      name: filename
      in: path
      required: true
      description: 头像文件名，形如 &lt;uuid&gt;.jpg，由上传接口生成；只接受该形态，其它取值一律按不存在处理。
      schema: { type: string, example: 0f0d6a5c-2b1f-4a3e-9c2d-7d5f1a2b3c4d.png }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    Keyword:
      name: keyword
      in: query
      required: false
      schema: { type: string, maxLength: 50 }
    SessionIdQuery:
      name: sessionId
      in: query
      required: false
      schema: { type: integer, format: int64 }
    RelaxType:
      name: type
      in: query
      required: false
      schema: { type: string, enum: [BREATHE, MEDITATION] }
    TrendDays:
      name: days
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
    ExportFormat:
      name: format
      in: query
      required: false
      schema: { type: string, enum: [txt, pdf], default: txt }
    FeedbackStatus:
      name: status
      in: query
      required: false
      schema: { type: string, enum: [PENDING, PROCESSED, REJECTED] }
    OperationType:
      name: type
      in: query
      required: false
      schema:
        type: string
        enum: [DOCUMENT, SCALE, ARTICLE, ANNOUNCEMENT, USER, NOTIFICATION, SENSITIVE_WORD, FEEDBACK, SYSTEM_SETTING]
    StartDate:
      name: startDate
      in: query
      required: false
      schema: { type: string, format: date }
    EndDate:
      name: endDate
      in: query
      required: false
      schema: { type: string, format: date }
  schemas:
    RegisterRequest:
      type: object
      required: [username, password, confirmPassword, nickname, gender, age]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        password: { type: string, format: password, minLength: 6, maxLength: 64 }
        confirmPassword: { type: string, format: password }
        nickname: { type: string }
        gender: { type: string }
        age: { type: integer, minimum: 1, maximum: 120 }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    TokenResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
      description: data 中包含 user；JWT 通过 HttpOnly Cookie 下发，不在响应 data 中返回。
    ProfileUpdateRequest:
      type: object
      properties:
        nickname: { type: string, maxLength: 64, description: 用户名（数据库字段 nickname） }
        gender: { type: string, enum: [男, 女, 不愿透露] }
        age: { type: integer, minimum: 1, maximum: 150 }
    PasswordUpdateRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 6, maxLength: 128 }
    CreateSessionRequest:
      type: object
      properties:
        name: { type: string, nullable: true }
    ChatMessageRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 2000 }
    AssessmentSubmitRequest:
      type: object
      required: [scaleId, answers]
      properties:
        scaleId: { type: integer, format: int64 }
        answers:
          type: array
          minItems: 1
          description: 必须提交量表中的全部题目，题目不可重复
          items:
            type: object
            required: [questionId]
            properties:
              questionId: { type: integer, format: int64 }
              optionId: { type: integer, format: int64 }
              optionIds:
                type: array
                items: { type: integer, format: int64 }
              textAnswer: { type: string, maxLength: 2000 }
              otherAnswer:
                type: string
                maxLength: 500
                description: 选择题选择其他选项时必须填写的补充内容
              matrixAnswers:
                type: object
                description: 矩阵题答案，key 为行标识，value 为所选列对应的分值
                additionalProperties: { type: integer, format: int64 }
    KnowledgeDocumentRequest:
      type: object
      required: [title, content]
      properties:
        title: { type: string, maxLength: 200 }
        content: { type: string, maxLength: 200000 }
    ArticleRequest:
      type: object
      required: [title, content]
      properties:
        title: { type: string, maxLength: 200 }
        summary: { type: string, maxLength: 500 }
        content: { type: string, maxLength: 200000 }
    UserStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, DISABLED]
    ScaleRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        applicableScene: { type: string, maxLength: 200 }
    QuestionRequest:
      type: object
      required: [order, content]
      properties:
        order: { type: integer, description: 题目顺序，从 1 开始 }
        content: { type: string, maxLength: 1000 }
        type:
          type: string
          enum: [SINGLE, MULTIPLE, TEXT, JUDGE, MATRIX]
          description: MATRIX 为矩阵题，需同时提交 matrixRows 与 matrixColumns
        matrixRows:
          type: string
          description: 矩阵题行标识，多个值使用英文逗号分隔
        matrixColumns:
          type: string
          description: 矩阵题列标识，多个值使用英文逗号分隔
        options:
          type: array
          items:
            type: object
            required: [label, score]
            properties:
              label: { type: string, maxLength: 500 }
              score: { type: integer }
    DiaryRequest:
      type: object
      required: [content, emotion]
      properties:
        content: { type: string, maxLength: 10000 }
        emotion:
          type: string
          enum: [HAPPY, CALM, STRESSED, ANXIOUS, LOW]
    ChatSettingsRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [COMPANION, ANALYTICAL]
    FavoriteRequest:
      type: object
      required: [favorite]
      properties:
        favorite: { type: boolean }
    AnnouncementRequest:
      type: object
      required: [title, content]
      properties:
        title: { type: string, maxLength: 200 }
        content: { type: string, maxLength: 10000 }
    AssessmentScale:
      type: object
      description: 量表列表项；favorited 由服务端按当前登录用户填充，匿名访问恒为 false。
      required: [id, name, favorited]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        applicableScene: { type: string }
        published: { type: boolean }
        favorited: { type: boolean }
    AssessmentFavorite:
      type: object
      required: [scaleId, name, published, favoritedAt]
      properties:
        scaleId: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        applicableScene: { type: string }
        published: { type: boolean }
        favoritedAt: { type: string, format: date-time }
    AssessmentComparison:
      type: object
      description: 同一量表的单次测评结果，用于结果对比。
      required: [resultId, createdAt]
      properties:
        resultId: { type: integer, format: int64 }
        totalScore: { type: integer }
        standardScore: { type: number, format: double }
        rangeDescription: { type: string }
        createdAt: { type: string, format: date-time }
    AssessmentRecommendation:
      type: object
      required: [scaleId, name, reason, priority]
      properties:
        scaleId: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        reason: { type: string, description: 推荐理由文案 }
        priority: { type: integer, description: 从 1 递增，数字越小越靠前 }
    RelaxOverview:
      type: object
      description: 放松小工具首页汇总；latestStressLevel 与 latestStressAt 在没有打卡时为 null。
      required: [weekPracticeCount, totalPracticeCount]
      properties:
        weekPracticeCount: { type: integer, format: int64, description: 最近 7 天练习次数 }
        weekAverageStress: { type: number, format: double, description: 最近 7 天平均压力，无数据为 null }
        totalPracticeCount: { type: integer, format: int64 }
        latestStressLevel: { type: integer, nullable: true }
        latestStressAt: { type: string, format: date-time, nullable: true }
    RelaxMeditation:
      type: object
      required: [id, title, minutes, segments]
      properties:
        id: { type: string, example: breath-3 }
        title: { type: string }
        minutes: { type: integer, enum: [3, 5, 10] }
        description: { type: string }
        segments:
          type: array
          items: { type: string }
    RelaxRecord:
      type: object
      required: [id, type, durationSeconds, createdAt]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, enum: [BREATHE, MEDITATION] }
        durationSeconds: { type: integer }
        rounds: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
    RelaxRecordRequest:
      type: object
      required: [type, durationSeconds]
      properties:
        type: { type: string, enum: [BREATHE, MEDITATION] }
        durationSeconds: { type: integer, minimum: 1, maximum: 3600 }
        rounds: { type: integer, minimum: 1, maximum: 100, nullable: true }
    RelaxRecordPage:
      type: object
      required: [items, page, size, total, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RelaxRecord' }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
        totalPages: { type: integer }
    StressLog:
      type: object
      required: [id, level, createdAt]
      properties:
        id: { type: integer, format: int64 }
        level: { type: integer, minimum: 1, maximum: 10 }
        note: { type: string, maxLength: 200, nullable: true }
        createdAt: { type: string, format: date-time }
    StressLogRequest:
      type: object
      required: [level]
      properties:
        level: { type: integer, minimum: 1, maximum: 10 }
        note: { type: string, maxLength: 200 }
    StressLogPage:
      type: object
      required: [items, page, size, total, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StressLog' }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
        totalPages: { type: integer }
    StressTrendPoint:
      type: object
      required: [logDate, averageLevel]
      properties:
        logDate: { type: string, format: date }
        averageLevel: { type: number, format: double }
    FavoriteMessage:
      type: object
      required: [id, content, sessionId, createdAt]
      properties:
        id: { type: integer, format: int64 }
        content: { type: string }
        sessionId: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
    FavoriteMessagePage:
      type: object
      required: [items, page, size, total, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FavoriteMessage' }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
        totalPages: { type: integer }
    SensitiveCheckRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, maxLength: 2000 }
    SensitiveCheck:
      type: object
      description: 只返回级别与统一提示文案，不回显命中的原始词。
      required: [triggered, level]
      properties:
        triggered: { type: boolean }
        level: { type: string, enum: [NONE, CARE, HIGH] }
        prompt: { type: string, nullable: true }
        hotline: { type: string, nullable: true }
    UserSettings:
      type: object
      required: [defaultChatMode, streamSpeed, messageRetention, dataConsent, theme, fontScale, messageSound, crisisTip]
      properties:
        defaultChatMode: { type: string, enum: [COMPANION, ANALYTICAL] }
        streamSpeed: { type: string, enum: [SLOW, NORMAL, FAST] }
        messageRetention: { type: string, enum: [PERMANENT, THIRTY_DAYS] }
        dataConsent: { type: boolean, description: 是否允许匿名使用对话数据优化知识库，默认关闭 }
        theme: { type: string, enum: [LIGHT, DARK] }
        fontScale: { type: string, enum: [SMALL, MEDIUM, LARGE] }
        messageSound: { type: boolean }
        crisisTip: { type: boolean }
        updatedAt: { type: string, format: date-time }
    UserSettingsRequest:
      type: object
      description: 所有字段可选，未提交的字段保持原值。
      properties:
        defaultChatMode: { type: string, enum: [COMPANION, ANALYTICAL] }
        streamSpeed: { type: string, enum: [SLOW, NORMAL, FAST] }
        messageRetention: { type: string, enum: [PERMANENT, THIRTY_DAYS] }
        dataConsent: { type: boolean }
        theme: { type: string, enum: [LIGHT, DARK] }
        fontScale: { type: string, enum: [SMALL, MEDIUM, LARGE] }
        messageSound: { type: boolean }
        crisisTip: { type: boolean }
    SystemPolicy:
      type: object
      required: [version, privacyPolicy, dataUsage, disclaimer, hotlines]
      properties:
        version: { type: string }
        privacyPolicy: { type: string }
        dataUsage: { type: string }
        disclaimer: { type: string }
        hotlines:
          type: array
          items: { type: string }
    Feedback:
      type: object
      required: [id, type, content, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        type: { type: string, enum: [BUG, SUGGESTION, OTHER] }
        content: { type: string }
        contact: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, PROCESSED, REJECTED] }
        remark: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, nullable: true }
    FeedbackRequest:
      type: object
      required: [type, content]
      properties:
        type: { type: string, enum: [BUG, SUGGESTION, OTHER] }
        content: { type: string, maxLength: 2000 }
        contact: { type: string, maxLength: 200 }
    FeedbackHandleRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [PENDING, PROCESSED, REJECTED] }
        remark: { type: string, maxLength: 500 }
    FeedbackPage:
      type: object
      required: [items, page, size, total, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Feedback' }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
        totalPages: { type: integer }
    Notification:
      type: object
      required: [id, scope, title, content, createdAt, read]
      properties:
        id: { type: integer, format: int64 }
        scope: { type: string, enum: [ALL, USER] }
        title: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }
        expireAt: { type: string, format: date-time, nullable: true, description: null 表示永不过期 }
        read: { type: boolean, description: 当前用户是否已读 }
    NotificationPushRequest:
      type: object
      required: [scope, title, content]
      properties:
        scope: { type: string, enum: [ALL, USER] }
        userId: { type: integer, format: int64, description: scope 为 USER 时必填 }
        title: { type: string, maxLength: 200 }
        content: { type: string, maxLength: 2000 }
        expireAt: { type: string, format: date-time, description: 可选，未提供时默认 30 天后过期 }
        permanent: { type: boolean, description: 为 true 时永不过期并忽略 expireAt }
    NotificationPage:
      type: object
      required: [items, page, size, total, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
        totalPages: { type: integer }
    SensitiveWord:
      type: object
      required: [id, word, level, enabled]
      properties:
        id: { type: integer, format: int64 }
        word: { type: string, maxLength: 64 }
        level: { type: string, enum: [CARE, HIGH] }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SensitiveWordRequest:
      type: object
      required: [word, level]
      properties:
        word: { type: string, maxLength: 64 }
        level: { type: string, enum: [CARE, HIGH] }
        enabled: { type: boolean, description: 不提交时保持原值，新增时默认启用 }
    OperationLog:
      type: object
      required: [id, type, createdAt]
      properties:
        id: { type: integer, format: int64 }
        operatorId: { type: integer, format: int64 }
        operatorName: { type: string }
        type: { type: string, enum: [DOCUMENT, SCALE, ARTICLE, ANNOUNCEMENT, USER, NOTIFICATION, SENSITIVE_WORD, FEEDBACK, SYSTEM_SETTING] }
        targetType: { type: string }
        targetId: { type: integer, format: int64 }
        summary: { type: string, description: 只描述动作与目标，不含业务正文 }
        createdAt: { type: string, format: date-time }
    OperationLogPage:
      type: object
      required: [items, page, size, total, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OperationLog' }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
        totalPages: { type: integer }
    KnowledgeSettings:
      type: object
      required: [chunkSize, chunkOverlap]
      properties:
        chunkSize: { type: integer, minimum: 100, maximum: 4000 }
        chunkOverlap: { type: integer, minimum: 0, maximum: 1000 }
    KnowledgeSettingsRequest:
      type: object
      required: [chunkSize, chunkOverlap]
      properties:
        chunkSize: { type: integer, minimum: 100, maximum: 4000 }
        chunkOverlap: { type: integer, minimum: 0, maximum: 1000 }
    ApiResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: OK }
        data: {}
  responses:
    Success:
      description: 请求成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Unauthorized:
      description: 未登录、令牌无效，或令牌合法但账号已被管理员禁用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Conflict:
      description: 资源状态已被其它请求改变，本次操作未生效；客户端应重新拉取最新状态后再试
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Session:
      description: 会话操作成功，data 为会话对象
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    SessionList:
      description: 会话列表查询成功，data 为会话数组
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    MessageList:
      description: 消息列表查询成功，data 为消息数组
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    AssessmentReport:
      description: |
        测评提交成功，data 包含 resultId、totalScore、standardScore、rangeDescription 和 suggestions（字符串数组，前端逐条渲染）。
        分值与区间描述全部由后端计算，结果仅供参考，不构成诊断。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    TooManyRequests:
      description: 重资源操作并发超限，请稍后重试（当前用于会话导出 PDF）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
