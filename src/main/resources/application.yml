server:
  port: 8080
  servlet:
    context-path: /api/v1
spring:
  application:
    name: mental-health-assistant
  # 延迟创建 Spring AI、Chroma 等外部服务 Bean，避免应用启动时建立向量库连接。
  main:
    lazy-initialization: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mindharbor?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mvc:
    problemdetails:
      enabled: true
  ai:
    retry:
      # 对话失败时不重复等待，避免一次请求叠加多轮重试延迟。
      max-attempts: ${AI_RETRY_MAX_ATTEMPTS:1}
    openai:
      base-url: ${AI_BASE_URL:}
      api-key: ${AI_API_KEY:}
      chat:
        options:
          model: ${AI_MODEL:}
          max-tokens: ${AI_MAX_TOKENS:512}
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:}
    vectorstore:
      chroma:
        # 首次启动时自动创建不存在的知识库集合。
        initialize-schema: true
        client:
          # Spring AI 会将 host 直接作为 URI 使用，必须包含协议。
          host: ${CHROMA_HOST:http://localhost}
          port: ${CHROMA_PORT:8000}
          key-token: ${CHROMA_KEY_TOKEN:}
        collection-name: ${CHROMA_COLLECTION:mental-health-knowledge}
logging:
  level:
    root: INFO
    com.mindharbor: INFO
    com.baomidou.mybatisplus: INFO
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
security:
  cookie:
    secure: ${COOKIE_SECURE:false}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:7200}
rag:
  chunk-size: ${RAG_CHUNK_SIZE:1000}
  chunk-overlap: ${RAG_CHUNK_OVERLAP:100}
user:
  avatar-upload-dir: ${AVATAR_UPLOAD_DIR:./uploads/avatars}
