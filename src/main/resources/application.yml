server:
  port: 8080
  servlet:
    context-path: /api/v1
spring:
  application:
    name: mental-health-assistant
  # 延迟创建 Spring AI、Chroma 等外部服务 Bean，避免应用启动时建立向量库连接。
  main:
    lazy-initialization: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  # 清理任务彼此独立调度，线程池至少两个线程，避免一个慢任务推迟另一个。
  task:
    scheduling:
      pool:
        # 定时任务从 2 个加到 5 个（新增补投、回访兜底、连击扫描）：
        # 仍留 2 个线程会互相排队，让每分钟的补投被其它任务拖后。
        size: ${TASK_SCHEDULING_POOL_SIZE:4}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mindharbor?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接池上限。默认 10 在本地压测中会成为「每请求回源一次数据库」这类端点的吞吐天花板，
    # 因此显式提高；上限受 MySQL 侧 max_connections 约束（docker-compose 中为 50），需留出余量。
    # minimum-idle 必须显式给出：HikariCP 缺省令它等于 maximum-pool-size，
    # 只改上限会把空闲连接一并抬到同等数量，在小内存服务器上白占内存。
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
  # Redis 只保存可重建的缓存，MySQL 仍是唯一持久化主库；连接信息统一走环境变量，缺省为本机默认实例。
  # 超时设短，Redis 不可达时快速失败并回退 MySQL，避免请求被连接等待拖住。
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2s}
  # RabbitMQ：高危信号事件链。
  # 用专属 vhost 而不是默认 "/"：这台 broker 同时被其他项目使用，同一个 vhost 下队列名一旦撞车
  # 就是互相抢消息；vhost 也便于整体删除而不误伤别人。
  # connection-timeout 必须设短：发布动作在 SSE 路径上（对话命中高危词），默认 60 秒会让用户
  # 在高危倾诉时界面卡住一分钟——这比收不到预警严重得多。
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    # 用户名和密码只从环境变量注入，不给默认值：写死在 yml 里会随代码进仓库。
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:mh}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:2s}
    publisher-confirm-type: ${RABBITMQ_PUBLISHER_CONFIRM_TYPE:correlated}
    publisher-returns: ${RABBITMQ_PUBLISHER_RETURNS:true}
    template:
      # 消息路由不到队列时退回给发送方，而不是静默丢弃。
      mandatory: ${RABBITMQ_TEMPLATE_MANDATORY:true}
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: ${RABBITMQ_CONCURRENCY:2}
        max-concurrency: ${RABBITMQ_MAX_CONCURRENCY:4}
        prefetch: ${RABBITMQ_PREFETCH:10}
        # 重试耗尽后拒绝消息，交给死信交换机；requeue=true 会变成死循环。
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: ${RABBITMQ_RETRY_MAX_ATTEMPTS:3}
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  mvc:
    problemdetails:
      enabled: true
  ai:
    retry:
      # 对话失败时不重复等待，避免一次请求叠加多轮重试延迟。
      max-attempts: ${AI_RETRY_MAX_ATTEMPTS:1}
    openai:
      base-url: ${AI_BASE_URL:}
      api-key: ${AI_API_KEY:}
      chat:
        options:
          model: ${AI_MODEL:}
          max-tokens: ${AI_MAX_TOKENS:2048}
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:}
    vectorstore:
      chroma:
        # 首次启动时自动创建不存在的知识库集合。
        initialize-schema: true
        client:
          # Spring AI 会将 host 直接作为 URI 使用，必须包含协议。
          host: ${CHROMA_HOST:http://localhost}
          port: ${CHROMA_PORT:8000}
          key-token: ${CHROMA_KEY_TOKEN:}
        collection-name: ${CHROMA_COLLECTION:mental-health-knowledge}
logging:
  level:
    root: INFO
    com.mindharbor: INFO
    com.baomidou.mybatisplus: INFO
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
# todo本地设false，线上设true
security:
  cookie:
    secure: ${COOKIE_SECURE:false}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:7200}

# 在线调试页面：/api/v1/swagger-ui/index.html，接口定义文件仍是 openapi.yaml。

rag:
  chunk-size: ${RAG_CHUNK_SIZE:1000}
  chunk-overlap: ${RAG_CHUNK_OVERLAP:100}
# 缓存 TTL 与单飞锁等待时间；只有文章详情会写"不存在"的空缓存，因此 missing-* 只出现在 article 下。
cache:
  article:
    ttl-seconds: ${CACHE_ARTICLE_TTL_SECONDS:3600}
    jitter-seconds: ${CACHE_ARTICLE_JITTER_SECONDS:600}
    missing-ttl-seconds: ${CACHE_ARTICLE_MISSING_TTL_SECONDS:300}
    missing-jitter-seconds: ${CACHE_ARTICLE_MISSING_JITTER_SECONDS:60}
  announcement:
    ttl-seconds: ${CACHE_ANNOUNCEMENT_TTL_SECONDS:3600}
    jitter-seconds: ${CACHE_ANNOUNCEMENT_JITTER_SECONDS:600}
  sensitive-word:
    ttl-seconds: ${CACHE_SENSITIVE_WORD_TTL_SECONDS:1200}
    jitter-seconds: ${CACHE_SENSITIVE_WORD_JITTER_SECONDS:300}
  rebuild-lock:
    wait-millis: ${CACHE_REBUILD_LOCK_WAIT_MILLIS:100}
app:
  version: ${APP_VERSION:1.0.0}

# 上传文件存储：type=local 写本地磁盘（默认），type=oss 写阿里云 OSS。
# OSS 模式保持 bucket 私有，头像由后端代理读取，因此对外地址与本地模式完全一致；密钥只从环境变量注入。
storage:
  type: ${STORAGE_TYPE:local}
  local:
    directory: ${AVATAR_UPLOAD_DIR:./uploads/avatars}
  oss:
    endpoint: ${OSS_ENDPOINT:}
    bucket: ${OSS_BUCKET:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    key-prefix: ${OSS_KEY_PREFIX:avatars}

# 会话导出：字体只缓存字节数组，每次导出新建 BaseFont；并发超限返回 429。
export:
  pdf:
    font-path: ${EXPORT_PDF_FONT_PATH:}
    max-concurrent: ${EXPORT_PDF_MAX_CONCURRENT:2}
    acquire-timeout-seconds: ${EXPORT_PDF_ACQUIRE_TIMEOUT_SECONDS:2}

# 定时清理任务：两个任务各自开关与周期，互不影响。
job:
  session-cleanup:
    enabled: ${JOB_SESSION_CLEANUP_ENABLED:true}
    cron: ${JOB_SESSION_CLEANUP_CRON:0 0 3 * * *}
    retention-days: ${JOB_SESSION_RETENTION_DAYS:30}
    batch-size: ${JOB_SESSION_CLEANUP_BATCH_SIZE:200}
  notification-cleanup:
    enabled: ${JOB_NOTIFICATION_CLEANUP_ENABLED:true}
    cron: ${JOB_NOTIFICATION_CLEANUP_CRON:30 0 3 * * *}
    retention-days: ${JOB_NOTIFICATION_RETENTION_DAYS:180}
    batch-size: ${JOB_NOTIFICATION_CLEANUP_BATCH_SIZE:200}

# 高危信号事件链的业务参数。
risk:
  alert:
    republish:
      # 投递补偿：把 publish_status 仍为 PENDING/FAILED 的事件重投一遍。
      enabled: ${RISK_ALERT_REPUBLISH_ENABLED:true}
      cron: ${RISK_ALERT_REPUBLISH_CRON:0 */1 * * * *}
      # 最小间隔要大于「写库到 confirm 返回」的窗口，否则会重复投递。
      min-age-seconds: ${RISK_ALERT_REPUBLISH_MIN_AGE_SECONDS:30}
      max-attempts: ${RISK_ALERT_REPUBLISH_MAX_ATTEMPTS:5}
      batch-size: ${RISK_ALERT_REPUBLISH_BATCH_SIZE:100}
      # 幂等记录保留天数；这张表只增不减，必须定期清。
      consumption-retention-days: ${RISK_ALERT_CONSUMPTION_RETENTION_DAYS:90}
    followup:
      # 24h 延迟回访；验证时可改小，但改完必须删除并重建 q.risk.followup.delay 队列才生效。
      delay-millis: ${RISK_ALERT_FOLLOWUP_DELAY_MILLIS:86400000}
    assessment:
      # 标准分（0~100）阈值，达到即判高危。
      threshold: ${RISK_ALERT_ASSESSMENT_THRESHOLD:70}
    diary:
      # 连续负面日记扫描：每天凌晨跑一次，只扫这段时间动过笔的用户。
      enabled: ${RISK_ALERT_DIARY_ENABLED:true}
      cron: ${RISK_ALERT_DIARY_CRON:0 0 3 * * *}
      negative-days: ${RISK_ALERT_DIARY_NEGATIVE_DAYS:3}
      # 冷却期：同一用户在该天数内不重复告警，避免持续低落的人天天收到提醒。
      cooldown-days: ${RISK_ALERT_DIARY_COOLDOWN_DAYS:7}
      # 扫描窗口：只看最近这些天有日记的用户，避免全表扫。
      lookback-days: ${RISK_ALERT_DIARY_LOOKBACK_DAYS:7}
