server:
  port: 8080
  servlet:
    context-path: /api/v1
spring:
  application:
    name: mental-health-assistant
  # 延迟创建 Spring AI、Chroma 等外部服务 Bean，避免应用启动时建立向量库连接。
  main:
    lazy-initialization: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  # 清理任务彼此独立调度，线程池至少两个线程，避免一个慢任务推迟另一个。
  task:
    scheduling:
      pool:
        size: ${TASK_SCHEDULING_POOL_SIZE:2}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mindharbor?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Redis 只保存可重建的缓存，MySQL 仍是唯一持久化主库；连接信息统一走环境变量，缺省为本机默认实例。
  # 超时设短，Redis 不可达时快速失败并回退 MySQL，避免请求被连接等待拖住。
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2s}
  mvc:
    problemdetails:
      enabled: true
  ai:
    retry:
      # 对话失败时不重复等待，避免一次请求叠加多轮重试延迟。
      max-attempts: ${AI_RETRY_MAX_ATTEMPTS:1}
    openai:
      base-url: ${AI_BASE_URL:}
      api-key: ${AI_API_KEY:}
      chat:
        options:
          model: ${AI_MODEL:}
          max-tokens: ${AI_MAX_TOKENS:512}
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:}
    vectorstore:
      chroma:
        # 首次启动时自动创建不存在的知识库集合。
        initialize-schema: true
        client:
          # Spring AI 会将 host 直接作为 URI 使用，必须包含协议。
          host: ${CHROMA_HOST:http://localhost}
          port: ${CHROMA_PORT:8000}
          key-token: ${CHROMA_KEY_TOKEN:}
        collection-name: ${CHROMA_COLLECTION:mental-health-knowledge}
logging:
  level:
    root: INFO
    com.mindharbor: INFO
    com.baomidou.mybatisplus: INFO
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
security:
  cookie:
    secure: ${COOKIE_SECURE:false}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:7200}

# 在线调试页面：/api/v1/swagger-ui/index.html，接口定义文件仍是 openapi.yaml。

rag:
  chunk-size: ${RAG_CHUNK_SIZE:1000}
  chunk-overlap: ${RAG_CHUNK_OVERLAP:100}
# 缓存 TTL 与单飞锁等待时间；只有文章详情会写"不存在"的空缓存，因此 missing-* 只出现在 article 下。
cache:
  article:
    ttl-seconds: ${CACHE_ARTICLE_TTL_SECONDS:3600}
    jitter-seconds: ${CACHE_ARTICLE_JITTER_SECONDS:600}
    missing-ttl-seconds: ${CACHE_ARTICLE_MISSING_TTL_SECONDS:300}
    missing-jitter-seconds: ${CACHE_ARTICLE_MISSING_JITTER_SECONDS:60}
  announcement:
    ttl-seconds: ${CACHE_ANNOUNCEMENT_TTL_SECONDS:3600}
    jitter-seconds: ${CACHE_ANNOUNCEMENT_JITTER_SECONDS:600}
  sensitive-word:
    ttl-seconds: ${CACHE_SENSITIVE_WORD_TTL_SECONDS:1200}
    jitter-seconds: ${CACHE_SENSITIVE_WORD_JITTER_SECONDS:300}
  rebuild-lock:
    wait-millis: ${CACHE_REBUILD_LOCK_WAIT_MILLIS:100}
app:
  version: ${APP_VERSION:1.0.0}

# 上传文件存储：type=local 写本地磁盘（默认），type=oss 写阿里云 OSS。
# OSS 模式保持 bucket 私有，头像由后端代理读取，因此对外地址与本地模式完全一致；密钥只从环境变量注入。
storage:
  type: ${STORAGE_TYPE:local}
  local:
    directory: ${AVATAR_UPLOAD_DIR:./uploads/avatars}
  oss:
    endpoint: ${OSS_ENDPOINT:}
    bucket: ${OSS_BUCKET:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    key-prefix: ${OSS_KEY_PREFIX:avatars}

# 会话导出：字体只缓存字节数组，每次导出新建 BaseFont；并发超限返回 429。
export:
  pdf:
    font-path: ${EXPORT_PDF_FONT_PATH:}
    max-concurrent: ${EXPORT_PDF_MAX_CONCURRENT:2}
    acquire-timeout-seconds: ${EXPORT_PDF_ACQUIRE_TIMEOUT_SECONDS:2}

# 定时清理任务：两个任务各自开关与周期，互不影响。
job:
  session-cleanup:
    enabled: ${JOB_SESSION_CLEANUP_ENABLED:true}
    cron: ${JOB_SESSION_CLEANUP_CRON:0 0 3 * * *}
    retention-days: ${JOB_SESSION_RETENTION_DAYS:30}
    batch-size: ${JOB_SESSION_CLEANUP_BATCH_SIZE:200}
  notification-cleanup:
    enabled: ${JOB_NOTIFICATION_CLEANUP_ENABLED:true}
    cron: ${JOB_NOTIFICATION_CLEANUP_CRON:30 0 3 * * *}
    retention-days: ${JOB_NOTIFICATION_RETENTION_DAYS:180}
    batch-size: ${JOB_NOTIFICATION_CLEANUP_BATCH_SIZE:200}
